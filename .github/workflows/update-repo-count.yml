name: Update Repo Count

on:
  schedule:
    - cron: "0 0 * * 0"  # Run every Sunday
  push:
    paths:
      - ".github/workflows/update-repo-count.yml"
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Repo Counts
        id: repos
        run: |
          # Get public repos
          PUBLIC=$(curl -s "https://api.github.com/users/${{ github.repository_owner }}" | jq -r '.public_repos')
          echo "public=$PUBLIC" >> $GITHUB_OUTPUT
          
          # Get private repos (needs auth)
          PRIVATE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user" | jq -r '.total_private_repos')
          echo "private=$PRIVATE" >> $GITHUB_OUTPUT
          
          echo "📊 Public: $PUBLIC | Private: $PRIVATE"

      - name: Update README Badges
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            
            const publicCount = '${{ steps.repos.outputs.public }}';
            const privateCount = '${{ steps.repos.outputs.private }}';
            
            // Update public repos badge
            let updated = readme.replace(
              /!\[Public Repos\]\(https:\/\/img\.shields\.io\/badge\/Public%20Repos-\d+/,
              `![Public Repos](https://img.shields.io/badge/Public%20Repos-${publicCount}`
            );
            
            // Add or update private repos badge
            if (updated.includes('Private%20Repos')) {
              updated = updated.replace(
                /!\[Private Repos\]\(https:\/\/img\.shields\.io\/badge\/Private%20Repos-\d+/,
                `![Private Repos](https://img.shields.io/badge/Private%20Repos-${privateCount}`
              );
            } else {
              // Add private repos badge after public repos badge
              updated = updated.replace(
                /(!\[Public Repos\]\([^)]+\))/,
                `$1\n![Private Repos](https://img.shields.io/badge/Private%20Repos-${privateCount}-8957e5?style=flat-square&logo=github&logoColor=white&labelColor=0d1117)`
              );
            }
            
            fs.writeFileSync('README.md', updated);
            console.log(`✅ Updated: Public=${publicCount}, Private=${privateCount}`);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo count badges [skip ci]" || exit 0
          git push
