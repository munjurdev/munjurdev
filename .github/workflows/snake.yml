# GitHub Actions workflow to generate the contribution snake animation
# This runs twice daily and updates the snake SVG in the 'output' branch

name: Generate Snake

on:
  schedule:
    - cron: "0 9,21 * * *"  # Runs at 9 AM and 9 PM UTC
  workflow_dispatch:         # Allows manual trigger

concurrency:
  group: snake-animation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: munjurdev
          outputs: dist/github-contribution-grid-snake-dark.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
