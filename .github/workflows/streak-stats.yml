name: Update Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"  # Run daily at 3:00 AM UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0d1117&stroke=58a6ff&ring=58a6ff&fire=f0883e&currStreakLabel=58a6ff&sideLabels=ffffff&currStreakNum=ffffff&sideNums=ffffff&dates=8b949e
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "Munjur Alom"
          git config user.email "munjurdev@gmail.com"
          git add profile/streak.svg
          git commit -m "Update streak stats [skip ci]" || exit 0
          git push
