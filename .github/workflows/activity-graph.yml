name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"  # Run every 12 hours
  push:
    paths:
      - ".github/workflows/activity-graph.yml"
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github&hide_border=true&bg_color=0d1117&color=58a6ff&line=58a6ff&point=ffffff&area=true&area_color=58a6ff&custom_title=GitHub%20Activity%20Graph
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace placeholder with actual graph
          cp profile/activity-graph.svg profile/activity-graph-placeholder.svg
          # Update README to use actual graph
          sed -i 's/activity-graph-placeholder.svg/activity-graph.svg/g' README.md
          git add profile/activity-graph.svg profile/activity-graph-placeholder.svg README.md
          git commit -m "Update activity graph [skip ci]" || exit 0
          git push
